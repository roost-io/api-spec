config:
  target: "{{ $processEnvironment.API_HOST }}/api/v1"
  plugins:
    expect: {}
  phases:
    - duration: 1
      arrivalCount: 1

scenarios:
  - name: "Successful fund deposit via UPI"
    flow:
      - log: "Sending POST request to deposit funds via UPI"
      - post:
          url: "/funds/deposit"
          headers:
            Content-Type: "application/json"
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          json:
            amount: 10000
            paymentMethod: "UPI"
            upiId: "user@upi"
          expect:
            - statusCode: 200
            - contentType: "application/json"
            - hasProperty: "description"
            - equals: 
                "description": "Transaction successful"
      - think: 1
