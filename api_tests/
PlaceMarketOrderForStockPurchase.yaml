config:
  target: "{{ $processEnvironment.API_HOST }}/api/v1"
  plugins:
    expect: {}
  phases:
    - duration: 1
      arrivalCount: 1

scenarios:
  - name: "Place market order for stock purchase"
    flow:
      - log: "Sending POST request to place market order for stock purchase"
      - post:
          url: "/trading/order"
          headers:
            Content-Type: "application/json"
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          json:
            symbol: "AAPL"
            quantity: 10
            orderType: "MARKET"
            transactionType: "BUY"
          expect:
            - statusCode: 200
            - contentType: "application/json"
            - hasProperty: "message"
            - hasProperty: "orderStatus"
            - hasProperty: "circuitBreakerStatus"
            - equals: 
                "message": "Order placed successfully"
                "orderStatus": "EXECUTED"
      - think: 1
