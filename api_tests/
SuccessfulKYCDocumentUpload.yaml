config:
  target: "{{ $processEnvironment.API_HOST }}/api/v1"
  plugins:
    expect: {}
  phases:
    - duration: 1
      arrivalCount: 1

scenarios:
  - name: "Successful KYC document upload"
    flow:
      - log: "Sending POST request to upload KYC document with valid token"
      - post:
          url: "/kyc/documents"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
            Content-Type: "multipart/form-data"
          formData:
            docType: "PAN"
            file: "valid-pan.pdf"
      - think: 1
      - expect:
          - statusCode: 200
          - contentType: "application/json"
          - hasProperty: "description"
          - equals:
              - "Document uploaded successfully"

      - log: "Sending POST request to upload KYC document with invalid token"
      - post:
          url: "/kyc/documents"
          headers:
            Authorization: "invalid_token"
            Content-Type: "multipart/form-data"
          formData:
            docType: "PAN"
            file: "valid-pan.pdf"
      - think: 1
      - expect:
          - statusCode: 401
          - contentType: "application/json"
          - hasProperty: "description"
          - equals:
              - "Unauthorized access"
